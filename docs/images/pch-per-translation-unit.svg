<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-label="Per translation unit frontend time, baseline on the x axis versus with a precompiled header on the y axis">
<style>
  .surface { fill: #fcfcfb; }
  .ink     { fill: #0b0b0b; }
  .ink2    { fill: #52514e; }
  .grid    { stroke: #e3e2df; stroke-width: 1; }
  .axis    { stroke: #c9c8c4; stroke-width: 1; }
  .s1      { fill: #2a78d6; }
  .s2      { fill: #eb6834; }
  .s1s     { stroke: #2a78d6; }
  .s2s     { stroke: #eb6834; }
  .ring    { stroke: #fcfcfb; }
  .refline { stroke: #a9a8a4; stroke-width: 2; stroke-dasharray: 5 4; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink     { fill: #ffffff; }
    .ink2    { fill: #c3c2b7; }
    .grid    { stroke: #333230; }
    .axis    { stroke: #4a4946; }
    .s1      { fill: #3987e5; }
    .s2      { fill: #d95926; }
    .s1s     { stroke: #3987e5; }
    .s2s     { stroke: #d95926; }
    .ring    { stroke: #1a1a19; }
    .refline { stroke: #6b6a66; }
  }
</style>
<rect class="surface" width="640" height="600"/>
<text class="ink" x="24" y="30" font-size="16" font-weight="600">44 of 48 translation units got faster</text>
<text class="ink2" x="24" y="50" font-size="12.5">One dot per translation unit. Below the dashed line is faster; above it, the prefix cost more than it saved.</text>
