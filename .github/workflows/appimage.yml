name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Pinned so the cache key matches the archive's package_ids. Keep in step with build.yml.
env:
  CONAN_VERSION: "2.31.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Get tags
        run: git fetch --tags origin

      - name: Install dependencies
        run: sudo apt install -y gcc g++ ninja-build python3-pip mold

      # pom.xml compiles with release 21; the runner image's default JDK is older.
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: '==3.3.*'
          dir: '${{github.workspace}}/Qt/'
          install-deps: 'true'
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qt5compat'
          archives: 'icu qtbase qtdeclarative qtsvg'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-linux'

      - name: Install AppImage tools
        run: |
          sudo apt-get install -y \
            libfuse2 \
            desktop-file-utils \
            librsvg2-dev
          wget -O ${{github.workspace}}/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -O ${{github.workspace}}/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x ${{github.workspace}}/linuxdeploy*.AppImage

      - name: Install conan
        id: conan
        run: |
          python3 -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> "$GITHUB_PATH"
          ./venv/bin/pip install "conan==${{ env.CONAN_VERSION }}"

      # Caching ~/.conan2 wholesale exceeds GitHub's 10 GB per-repository budget (the dir is
      # ~14 GB with build trees and extracted sources), so the save is dropped and every run
      # starts cold. Cache a `conan cache save` archive of the package binaries instead.
      - name: Restore conan archive
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/conan-deps.tgz
          key: conan5-Linux-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt', '.conan/gcc/profile') }}
          restore-keys: |
            conan5-Linux-${{ env.CONAN_VERSION }}-

      - name: Unpack conan archive
        if: steps.conan-cache.outputs.cache-matched-key != ''
        run: conan cache restore ${{ runner.temp }}/conan-deps.tgz

      - name: Install conan dependencies
        run: conan install . -s build_type=Release -of .conan/gcc --build=missing -pr:a .conan/gcc/profile

      - name: Pack conan archive
        if: ${{ !cancelled() && steps.conan.outcome == 'success' && steps.conan-cache.outputs.cache-hit != 'true' }}
        run: |
          conan cache clean "*" --source --build --download --temp
          conan cache save "*:*" --no-source --file ${{ runner.temp }}/conan-deps.tgz

      - name: Save conan archive
        if: ${{ !cancelled() && steps.conan.outcome == 'success' && steps.conan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/conan-deps.tgz
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}

      # Published by llvm.yml. Replaces a download-artifact pinned to a hardcoded run-id, which
      # expired 90 days after that run.
      - name: Download LLVM/Clang
        uses: robinraju/release-downloader@v1.12
        with:
          tag: "llvm-clang-23.1.0"
          fileName: "llvm-clang-23.1.0-linux-x86_64.tgz"
          token: ${{ secrets.GITHUB_TOKEN }}
          out-file-path: ${{ runner.temp }}
          extract: false

      # A cache hit after the restore; the script also creates the external/ symlink that
      # ci_gnu_release_build_cxx expects.
      - name: Install LLVM/Clang
        run: |
          conan cache restore ${{ runner.temp }}/llvm-clang-23.1.0-linux-x86_64.tgz
          ./scripts/build_llvm_conan.sh

      - name: Configure CMake
        run: cmake --preset="ci_gnu_release_build_cxx"

      - name: Build
        run: cmake --build ${{github.workspace}}/build

      - name: Install
        working-directory: ${{github.workspace}}/build
        run: cmake --install .

      - name: Create AppImage
        working-directory: ${{github.workspace}}
        run: |
          ${{github.workspace}}/linuxdeploy-x86_64.AppImage \
            --appdir ${{github.workspace}}/build/install \
            --plugin qt \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: ${{github.workspace}}/*.AppImage
