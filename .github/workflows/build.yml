name: Build

# NOTE: `paths` must stay identical for both triggers, and must cover every input that feeds
# the Conan cache key. If `conanfile.txt` is missing here, a dependency bump never re-runs on
# `main`, so the new cache key is never written to the default branch -- and pull requests can
# only read caches from the default branch. That is a silent, permanent cache miss.
on:
  push:
    branches: ["main"]
    paths:
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.cpp"
      - "**/CMakeLists.txt"
      - "**/*.cmake"
      - "CMakePresets.json"
      - "conanfile.txt"
      - ".conan/**"
      - "scripts/**"
      - .github/workflows/*.yml
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.cpp"
      - "**/CMakeLists.txt"
      - "**/*.cmake"
      - "CMakePresets.json"
      - "conanfile.txt"
      - ".conan/**"
      - "scripts/**"
      - .github/workflows/*.yml

# The Conan client version is pinned rather than resolved at runtime. It is part of the cache
# key (an upgrade changes package_ids, and a restored archive from another client would look
# valid while silently forcing a full from-source rebuild), and pinning is what lets the `deps`
# job compute that key before it has installed anything.
env:
  CONAN_VERSION: "2.31.2"

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history to ensure base SHA is available

      - name: Install clang-format
        run: |
          sudo apt-get install clang-format-18 -y

      - name: Run clang-format style check for modified .cpp|.h|.hpp files
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=M ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '\.(cpp|h|hpp)$' || true)
          echo
          if [ -n "$CHANGED_FILES" ]; then
            clang-format --dry-run --Werror $CHANGED_FILES
          else
            echo "No C++ files to check with clang-format."
          fi

  cmake-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format CMake files
        id: cmake-format
        uses: PuneetMatharu/cmake-format-lint-action@v1.0.4
        with:
          args: --config-files .cmake-format.yaml --check

  # Dependencies are built once here and every build leg restores them. Without this job the
  # matrix legs all miss the same cold key at the same moment and each spend ~28 minutes
  # building an identical dependency set, three of them then losing the save race.
  #
  # It is an optimisation, not a gate: the build legs keep their own restore + `conan install`,
  # so a failure here costs a cold leg rather than the whole run (see the `if:` on `build`).
  deps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    name: Conan dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `lookup-only` does not download the archive. On a warm key this job confirms the entry
      # exists and stops, so the wait it adds to the build matrix is job startup and nothing
      # more. No `restore-keys` here on purpose -- only an exact hit means "nothing to do".
      - name: Look up conan archive
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/conan-deps.tgz
          key: conan5-${{ runner.os }}-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt', '.conan/gcc/profile') }}
          lookup-only: true

      # setup-python instead of a venv: pip installs work identically on both runners, so the
      # rest of this job needs no OS split beyond the `conan install` line itself.
      - name: Setup python
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install conan
        id: conan
        if: steps.lookup.outputs.cache-hit != 'true'
        run: pip install "conan==${{ env.CONAN_VERSION }}"
        shell: bash

      # A partial hit restores every unchanged dependency, so a one-package bump rebuilds one
      # package instead of all of them.
      - name: Restore conan archive
        id: restore
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/conan-deps.tgz
          key: ${{ steps.lookup.outputs.cache-primary-key }}
          restore-keys: |
            conan5-${{ runner.os }}-${{ env.CONAN_VERSION }}-

      - name: Unpack conan archive
        if: steps.restore.outputs.cache-matched-key != ''
        run: conan cache restore "${{ runner.temp }}/conan-deps.tgz"
        shell: bash

      - name: Install conan dependencies (Ubuntu)
        if: steps.lookup.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: conan install . -s build_type=Release -of .conan/gcc --build=missing -pr:a .conan/gcc/profile

      - name: Install conan dependencies (Windows)
        if: steps.lookup.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: |
          conan profile detect --force
          conan install . --build missing -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja -of .conan/msvc/
        shell: bash

      # `!cancelled()` banks whatever did build when a later package fails, so the retry is
      # warmer. The `conan` guard keeps these from running -- and reporting
      # `conan: command not found` over the real error -- when the client never installed.
      - name: Pack conan archive
        if: ${{ !cancelled() && steps.lookup.outputs.cache-hit != 'true' && steps.conan.outcome == 'success' }}
        run: |
          conan cache clean "*" --source --build --download --temp
          conan cache save "*:*" --no-source --file "${{ runner.temp }}/conan-deps.tgz"
        shell: bash

      - name: Save conan archive
        if: ${{ !cancelled() && steps.lookup.outputs.cache-hit != 'true' && steps.conan.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/conan-deps.tgz
          key: ${{ steps.lookup.outputs.cache-primary-key }}

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows Latest MSVC",
              os: windows-latest,
              tag: msvc,
              environment_script: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat",
              "with_cxx": "",
            }
          # NOTE: there is deliberately no Windows `_build_cxx` leg. The C/C++ indexer needs
          # LLVM/Clang 22, and .conan/recipes/llvm-clang/ has only been validated on Linux/GCC.
          # Re-add this leg once llvm.yml gains a windows-latest job producing the package.
          - {
              name: "Ubuntu Latest GCC",
              os: ubuntu-24.04,
              tag: gnu,
              "with_cxx": "",
            }
          - {
              name: "Ubuntu Latest GCC with cxx_build",
              os: ubuntu-24.04,
              tag: gnu,
              "with_cxx": "_build_cxx",
            }
          - {
              name: "Ubuntu Latest CLang",
              os: ubuntu-24.04,
              tag: "clang",
              "with_cxx": "",
            }
          - {
              name: "Ubuntu Latest CLang cxx_build",
              os: ubuntu-24.04,
              tag: "clang",
              "with_cxx": "_build_cxx",
            }

    name: ${{ matrix.config.name }}
    needs: [clang-format, cmake-format, deps]
    if: ${{ !cancelled() && needs.clang-format.result == 'success' && needs.cmake-format.result == 'success' }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Get tags
        run: git fetch --tags origin

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt install -y gcc g++ clang ninja-build python3-pip grep mold

      # `mvn` is preinstalled on the runner, so BUILD_JAVA_INDEXER defaults ON and the plugin is
      # always built. pom.xml compiles with release 21; the image's default JDK is older.
      - name: Install JDK (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Qt (Ubuntu)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: "==3.3.*"
          dir: "${{github.workspace}}/Qt/"
          install-deps: "true"
          version: "6.10.3"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"
          modules: "qt5compat"
          archives: "icu qtbase qtdeclarative qtsvg"
          cache: "true"
          cache-key-prefix: "install-qt-action-linux"

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: "==3.3.*"
          dir: "${{github.workspace}}/Qt/"
          install-deps: "true"
          version: "6.10.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qt5compat"
          archives: "qtbase qtdeclarative qtsvg"
          cache: "true"
          cache-key-prefix: "install-qt-action-windows"

      # `venv/bin` goes on PATH so every later step can call `conan` directly and the cache
      # steps below stay identical on Linux and Windows.
      - name: Install conan & gcovr (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> "$GITHUB_PATH"
          ./venv/bin/pip install "conan==${{ env.CONAN_VERSION }}" gcovr

      - name: Install conan (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install "conan==${{ env.CONAN_VERSION }}" && conan profile detect
        shell: bash

      # Restore only -- the `deps` job owns writing this cache. One archive per OS: every Linux
      # leg installs the same gcc/Release dependency set, so gnu and clang share it and
      # `matrix.config.tag` is deliberately absent from the key.
      #
      # We cache a single `conan cache save` archive, NOT ~/.conan2 itself. The full cache dir
      # is ~14 GB (build trees, extracted sources, download tarballs) which blows past GitHub's
      # 10 GB per-repository budget, so the post-job save is dropped and every run starts cold.
      # The archive holds package binaries only -- a few hundred MB.
      - name: Restore conan archive
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/conan-deps.tgz
          key: conan5-${{ runner.os }}-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt', '.conan/gcc/profile') }}
          # A partial hit still restores every unchanged dependency, so a one-package bump
          # rebuilds one package instead of all of them.
          restore-keys: |
            conan5-${{ runner.os }}-${{ env.CONAN_VERSION }}-

      # Paths are quoted throughout: on Windows `runner.temp` expands to `D:\a\_temp`, and bash
      # would otherwise eat the backslashes.
      - name: Unpack conan archive
        if: steps.conan-cache.outputs.cache-matched-key != ''
        run: conan cache restore "${{ runner.temp }}/conan-deps.tgz"
        shell: bash

      # Normally a no-op that just writes the generator files: `deps` already built everything
      # and the restore above brought it in. Kept unconditional so a leg still builds if the
      # `deps` job failed.
      #
      # Linux uses exactly one Conan install: gcc/Release. The clang legs build the application
      # with clang against these gcc-built dependencies -- both use libstdc++11, so the ABI
      # matches, and `.conan/clang/profile` (which had no build_type, breaking every tool_require
      # in the build context) is gone.
      - name: Install conan dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: conan install . -s build_type=Release -of .conan/gcc --build=missing -pr:a .conan/gcc/profile

      - name: Install conan dependencies (Windows)
        if: runner.os == 'Windows'
        run: conan install . --build missing -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja -of .conan/msvc/
        shell: bash

      # LLVM/Clang comes from the release asset published by llvm.yml -- never built here.
      # Release assets are not subject to the 7-day cache eviction or the 10 GB budget, which
      # leaves the whole cache budget to the dependency archive above.
      - name: Download LLVM/Clang
        if: matrix.config.with_cxx == '_build_cxx'
        uses: robinraju/release-downloader@v1.12
        with:
          tag: "llvm-clang-22.1.8"
          fileName: "llvm-clang-22.1.8-linux-x86_64.tgz"
          token: ${{ secrets.GITHUB_TOKEN }}
          out-file-path: ${{ runner.temp }}
          extract: false

      # After the restore, build_llvm_conan.sh's `--build=missing` is a cache hit (seconds), and
      # it still creates the external/ symlink the `*_build_cxx` presets expect at
      # ${sourceDir}/external/lib/cmake/clang/.
      #
      # The package is built with .conan/gcc/profile and reused by the clang leg: lib_cxx finds
      # LLVM through find_package(Clang) on the install tree, and clang uses libstdc++ on Linux,
      # so the ABI matches.
      - name: Install LLVM/Clang
        if: matrix.config.with_cxx == '_build_cxx'
        run: |
          conan cache restore "${{ runner.temp }}/llvm-clang-22.1.8-linux-x86_64.tgz"
          ./scripts/build_llvm_conan.sh

      - name: Configure CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: cmake --preset="ci_${{ matrix.config.tag }}_release${{ matrix.config.with_cxx }}"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        env:
          # install-qt-action exports QT_ROOT_DIR for Qt6; Qt5_DIR was a Qt5 leftover and
          # expanded to an empty string.
          CMAKE_PREFIX_PATH: ${{env.QT_ROOT_DIR}}
        run: |
          call "${{ matrix.config.environment_script }}"
          cmake --preset="ci_${{ matrix.config.tag }}_release${{ matrix.config.with_cxx }}"
        shell: cmd

      - name: Build (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -eo pipefail  # Stop on first error
          cmake --build ${{github.workspace}}/build | tee ${{github.workspace}}/build/build.log
          exit ${PIPESTATUS[0]}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          call "${{ matrix.config.environment_script }}"
          cmake --build ${{github.workspace}}/build > ${{github.workspace}}/build/build.log 2>&1 || (type ${{github.workspace}}/build/build.log && exit /b %errorlevel%)
        shell: cmd

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.config.tag }}${{ matrix.config.with_cxx }}
          path: ${{github.workspace}}/build/build.log
          retention-days: 7

      - name: Count warnings (Ubuntu)
        if: runner.os == 'Linux'
        run: grep -c "warning:" ${{github.workspace}}/build/build.log

      - name: Test (Ubuntu)
        if: runner.os == 'Linux'
        run: ctest -Q --test-dir ${{github.workspace}}/build --output-junit ${{github.workspace}}/build/report.xml

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir ${{github.workspace}}/build --exclude-regex "unittests\.core\.GenerateRandomString\.goodCase|unittests\.core\.CommandlineCommandIndexFix\.projectIsAbsent|unittests\.core\.CommandlineCommandIndexFix\.projectIsInvalidProj|unittests\.core\.CommandLineParserConfig\.projectFileMissingExtention|unittests\.core\.CommandLineParserConfig\.emptyProjectFile|unittests\.lib\.BookmarkControllerFix\.displayBookmarksFor2|unittests\.lib\.FileHandler\.goodCaseEmptyFile|unittests\.lib\.FileHandler\.emptyFileCanNotCreated|unittests\.lib\.FileHandler\.goodCaseFromBuffer|unittests\.lib\.FileHandler\.PassZeroToFromBuffer|unittests\.lib\.FileHandler\.goodCaseRandomData|unittests\.lib\.FileHandler\.PassZeroToRandomData|unittests\.lib_gui\.utilityAppTestSuite\.searchPath|QtSelfRefreshIconButtonTestSuite" --output-junit ${{github.workspace}}/build/report.xml
        shell: cmd

      - name: Upload ctest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.config.tag }}${{ matrix.config.with_cxx }}
          path: ${{github.workspace}}/build/report.xml
          retention-days: 7

      - name: Publish Test Report for ${{ matrix.config.name }}
        uses: mikepenz/action-junit-report@v4
        if: runner.os == 'Linux'
        with:
          report_paths: ${{github.workspace}}/build/report.xml
          include_passed: true
          detailed_summary: true

      - name: Upload build directory as artifact
        if: runner.os == 'Linux' && matrix.config.tag == 'gnu' && matrix.config.with_cxx == '_build_cxx'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.event.number }}
          path: |
            ${{ github.workspace }}/build/compile_commands.json
            ${{ github.workspace }}/build/Sourcetrail_lib_gui_autogen
            ${{ github.workspace }}/build/src

  clang_tidy:
    needs: build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/clang_tidy.yml
    secrets: inherit

  cppcheck:
    needs: build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/cppcheck.yaml
    secrets: inherit
