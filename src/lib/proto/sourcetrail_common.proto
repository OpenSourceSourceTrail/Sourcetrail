syntax = "proto3";

package sourcetrail;

// Storage POD types ----------------------------------------------------------

message StorageNode {
  uint64 id = 1;
  int32 type = 2;
  string serialized_name = 3;  // UTF-8 encoded wstring
}

message StorageEdge {
  uint64 id = 1;
  int32 type = 2;
  uint64 source_node_id = 3;
  uint64 target_node_id = 4;
}

message StorageFile {
  uint64 id = 1;
  string file_path = 2;          // UTF-8 encoded wstring
  string language_identifier = 3; // UTF-8 encoded wstring
  string modification_time = 4;
  bool indexed = 5;
  bool complete = 6;
}

message StorageSymbol {
  uint64 id = 1;
  int32 definition_kind = 2;
}

message StorageLocalSymbol {
  uint64 id = 1;
  string name = 2;  // UTF-8 encoded wstring
}

message StorageSourceLocation {
  uint64 id = 1;
  uint64 file_node_id = 2;
  uint64 start_line = 3;
  uint64 start_col = 4;
  uint64 end_line = 5;
  uint64 end_col = 6;
  int32 type = 7;
}

message StorageOccurrence {
  uint64 element_id = 1;
  uint64 source_location_id = 2;
}

message StorageComponentAccess {
  uint64 node_id = 1;
  int32 type = 2;
}

message StorageError {
  uint64 id = 1;
  string message = 2;          // UTF-8 encoded wstring
  string translation_unit = 3; // UTF-8 encoded wstring
  bool fatal = 4;
  bool indexed = 5;
}

// IndexerCommand (common base + CXX/Java extensions) --------------------------

message IndexerCommand {
  enum CommandType {
    UNKNOWN = 0;
    CXX = 1;
    JAVA = 2;
  }
  CommandType type = 1;
  string source_file_path = 2; // UTF-8 encoded wstring

  // CXX fields (only set when type == CXX)
  repeated string indexed_paths = 3;
  repeated string exclude_filters = 4;
  repeated string include_filters = 5;
  string working_directory = 6;
  repeated string compiler_flags = 7; // UTF-8 encoded wstrings

  // Java fields (only set when type == JAVA)
  repeated string class_paths = 8;
  string language_standard = 9;
}

// IntermediateStorage --------------------------------------------------------

message IntermediateStorage {
  repeated StorageNode nodes = 1;
  repeated StorageFile files = 2;
  repeated StorageSymbol symbols = 3;
  repeated StorageEdge edges = 4;
  repeated StorageLocalSymbol local_symbols = 5;
  repeated StorageSourceLocation source_locations = 6;
  repeated StorageOccurrence occurrences = 7;
  repeated StorageComponentAccess component_accesses = 8;
  repeated StorageError errors = 9;
  uint64 next_id = 10;
}
