syntax = "proto3";

package sourcetrail;

import "sourcetrail_common.proto";

// Boundary A: client (GUI/web app) <-> engine daemon.
//
// This file declares no service. The boundary is HTTP + JSON so that a browser can speak it, and
// these messages are the payload schema: every one is encoded with protobuf's canonical JSON
// mapping. The route table lives in src/app/engine/EngineHttpService.cpp.
//
// Note for JSON consumers: canonical protobuf JSON renders uint64 as a *string*, because a JSON
// number cannot hold 64 bits. Node, edge and location ids therefore arrive quoted ("12345").

// ---------- Shared primitives -----------------------------------------------

message EmptyRequest {}
message EmptyResponse {}
message IdRequest { uint64 id = 1; }
message IdResponse { uint64 id = 1; }
message IdsRequest { repeated uint64 ids = 1; }
message IdsResponse { repeated uint64 ids = 1; }
message FilePathRequest { string file_path = 1; }
message FilePathsRequest { repeated string file_paths = 1; }
message NodeKindMaskRequest { int32 mask = 1; }
message NodeKindMaskResponse { int32 mask = 1; }
message NodeKindResponse { int32 kind = 1; }
message EdgeTypeMaskResponse { int32 mask = 1; }
message NameHierarchyRequest { string serialized = 1; }
message NameHierarchyResponse { string serialized = 1; }
message NameHierarchiesRequest { repeated string serialized = 1; }
message NameHierarchiesResponse { repeated string serialized = 1; }

// ---------- Domain types ----------------------------------------------------

message StorageEdgeResponse { StorageEdge edge = 1; }

message ProtoSourceLocation {
  uint64 location_id = 1;
  repeated uint64 token_ids = 2;
  int32 type = 3;
  uint64 start_line = 4;
  uint64 start_col = 5;
  uint64 end_line = 6;
  uint64 end_col = 7;
}

message ProtoSourceLocationFile {
  string file_path = 1;
  string language = 2;
  bool is_whole = 3;
  bool is_complete = 4;
  bool is_indexed = 5;
  repeated ProtoSourceLocation locations = 6;
}

// A single entry of TokenComponentBundledEdges. The component's Direction is *derived* from the
// per-id directions (it collapses to DIRECTION_NONE when they disagree), so the direction must be
// carried per id -- a single direction field would not round-trip a mixed bundle.
message ProtoBundledEdge {
  uint64 id = 1;
  bool forward = 2;
}

message ProtoGraph {
  message ProtoNode {
    uint64 id = 1;
    int32 node_kind = 2;
    string name_hierarchy_serialized = 3;
    int32 definition_kind = 4;
    uint64 child_count = 5;
    // TokenComponentAccess; absent when the node carries no access component.
    optional int32 access_kind = 6;
    // TokenComponentFilePath; both fields present together or not at all.
    optional string file_path = 7;
    optional bool file_path_complete = 8;
  }
  message ProtoEdge {
    uint64 id = 1;
    int32 type = 2;
    uint64 from_node_id = 3;
    uint64 to_node_id = 4;
    // TokenComponentIsAmbiguous (presence-only component).
    bool is_ambiguous = 5;
    // TokenComponentInheritanceChain.
    repeated uint64 inheritance_chain_edge_ids = 6;
    // TokenComponentBundledEdges. has_bundled_edges distinguishes "no component" from "component
    // present but empty"; the GUI dereferences this component without a null check.
    bool has_bundled_edges = 7;
    repeated ProtoBundledEdge bundled_edges = 8;
  }
  repeated ProtoNode nodes = 1;
  repeated ProtoEdge edges = 2;
  // Graph::TrailMode
  int32 trail_mode = 3;
  bool has_trail_origin = 4;
}

message ProtoSearchMatch {
  string name = 1;
  string text = 2;
  string subtext = 3;
  repeated uint64 token_ids = 4;
  repeated string token_names_serialized = 5;
  string type_name = 6;
  int32 node_kind = 7;
  int32 search_type = 8;
  repeated uint64 indices = 9;
  int32 score = 10;
  bool has_children = 11;
  int32 command_type = 12;
}

message ProtoFileInfo {
  string file_path = 1;
  string last_write_time = 2;
}

message ProtoBookmarkCategory {
  uint64 id = 1;
  string name = 2;
}

message ProtoBookmark {
  uint64 id = 1;
  string name = 2;
  string comment = 3;
  string timestamp = 4;
  ProtoBookmarkCategory category = 5;
}

message ProtoNodeBookmark {
  ProtoBookmark base = 1;
  repeated uint64 node_ids = 2;
}

message ProtoEdgeBookmark {
  ProtoBookmark base = 1;
  repeated uint64 edge_ids = 2;
  uint64 active_node_id = 3;
}

message ProtoStorageStats {
  uint64 node_count = 1;
  uint64 edge_count = 2;
  uint64 file_count = 3;
  uint64 completed_file_count = 4;
  uint64 file_loc_count = 5;
  string timestamp = 6;
}

message ProtoErrorInfo {
  uint64 id = 1;
  string message = 2;
  string file_path = 3;
  uint64 line_number = 4;
  uint64 column_number = 5;
  string translation_unit = 6;
  bool fatal = 7;
  bool indexed = 8;
}

message ProtoErrorFilter {
  bool error = 1;
  bool fatal = 2;
  bool unindexed_error = 3;
  bool unindexed_fatal = 4;
  uint64 limit = 5;
}

message ProtoTooltipSnippet {
  string code = 1;
  ProtoSourceLocationFile location_file = 2;
}

message ProtoTooltipInfo {
  string title = 1;
  int32 count = 2;
  string count_text = 3;
  repeated ProtoTooltipSnippet snippets = 4;
  float offset_x = 5;
  float offset_y = 6;
}

// ---------- Request/response messages ---------------------------------------

message LoadProjectRequest { string project_file_path = 1; }

// Returned state lets the client answer isLoaded()/isReindexable()/getDescription() from a cached
// value: those are called from Qt enable/paint paths and must never block on a round trip.
message LoadProjectResponse {
  bool loaded = 1;
  bool reindexable = 2;
  bool indexing = 3;
  string description = 4;
  // Empty when the load succeeded; otherwise a message for the client to surface.
  string error_message = 5;
}

message RefreshRequest { bool all = 1; }

message PluginInfo {
  string id = 1;
  string name = 2;
  int32 language = 3;
  repeated int32 source_group_types = 4;
  int32 command_type = 5;
}

message CapabilitiesResponse {
  repeated PluginInfo plugins = 1;
  // Union of every plugin's source group types, plus the types the engine supports without any
  // plugin (Custom Command needs only a user-supplied shell command, no indexer binary).
  repeated int32 supported_source_group_types = 2;
  repeated int32 supported_languages = 3;
  // False only when the engine can index nothing at all; the client greys out New/Edit/Refresh.
  bool can_create_project = 4;
  string engine_version = 5;
}
message CompilationDatabaseInfoRequest { string cdb_path = 1; }
message CompilationDatabaseInfoResponse {
  // False when the file is missing, malformed, or this engine has no C/C++ package; `error` says
  // which, and the remaining fields are empty.
  bool valid = 1;
  string error = 2;
  // Absolute canonical paths, unfiltered: exclude filters are the client's business.
  repeated string source_files = 3;
  // Every include path the compile commands mention -- user, system and framework alike.
  repeated string header_paths = 4;
  bool contains_include_pch_flags = 5;
}

message AddNodeBookmarkRequest {
  ProtoBookmark base = 1;
  repeated uint64 node_ids = 2;
}
message AddEdgeBookmarkRequest {
  ProtoBookmark base = 1;
  repeated uint64 edge_ids = 2;
  uint64 active_node_id = 3;
}
message AddBookmarkCategoryRequest { string name = 1; }
message BookmarkIdResponse { uint64 id = 1; }
message UpdateBookmarkRequest {
  uint64 bookmark_id = 1;
  string name = 2;
  string comment = 3;
  string category_name = 4;
}
message RemoveBookmarkRequest { uint64 bookmark_id = 1; }
message RemoveBookmarkCategoryRequest { uint64 category_id = 1; }

message SourceLocationCollectionResponse {
  repeated ProtoSourceLocationFile files = 1;
}
message SourceLocationFileResponse { ProtoSourceLocationFile file = 1; }
// GET /api/v1/graph answers every mode with this one shape: the former GetGraphForAll,
// GetGraphForNodeTypes, GetGraphForActiveTokenIds, GetGraphForChildrenOfNodeId and GetGraphForTrail
// differed only in how the graph was selected, not in what came back.
message GraphQueryResponse {
  ProtoGraph graph = 1;
  // Only meaningful for mode=active.
  bool is_active_namespace = 2;
  // Filled when the request asks for include=parentFiles, so graph layout does not need a second
  // round trip to group nodes by file.
  repeated NodeIdToParentFileMapResponse.Entry parent_files = 3;
}
message SearchMatchesResponse { repeated ProtoSearchMatch matches = 1; }
message FileInfoResponse { ProtoFileInfo file_info = 1; }
message FileInfosResponse { repeated ProtoFileInfo file_infos = 1; }
message StorageStatsResponse { ProtoStorageStats stats = 1; }
message ErrorCountResponse {
  uint64 total = 1;
  uint64 fatal = 2;
}
message ErrorInfosResponse { repeated ProtoErrorInfo errors = 1; }
message ErrorInfosRequest { repeated ProtoErrorInfo errors = 1; }
message NodeIdToParentFileMapResponse {
  message Entry {
    uint64 node_id = 1;
    uint64 parent_file_id = 2;
    string name_hierarchy_serialized = 3;
  }
  repeated Entry entries = 1;
}
message ActiveTokenIdsResponse {
  repeated uint64 ids = 1;
  uint64 declaration_id = 2;
}
message ActiveTokenIdRequest { uint64 token_id = 1; }
message NodeBookmarksResponse { repeated ProtoNodeBookmark bookmarks = 1; }
message EdgeBookmarksResponse { repeated ProtoEdgeBookmark bookmarks = 1; }
message BookmarkCategoriesResponse { repeated ProtoBookmarkCategory categories = 1; }
message TooltipInfoResponse { ProtoTooltipInfo info = 1; }

message FullTextSearchRequest {
  string search_term = 1;
  bool case_sensitive = 2;
}
message AutocompletionRequest {
  string query = 1;
  int32 accepted_node_types_mask = 2;
  bool accept_commands = 3;
}
message ActiveTokensRequest {
  repeated uint64 token_ids = 1;
  repeated uint64 expanded_node_ids = 2;
}
message TrailRequest {
  uint64 origin_id = 1;
  uint64 target_id = 2;
  int32 node_types_mask = 3;
  int32 edge_types_mask = 4;
  bool node_non_indexed = 5;
  uint64 depth = 6;
  bool directed = 7;
}
message LinesInFileRequest {
  string file_path = 1;
  uint64 start_line = 2;
  uint64 end_line = 3;
}
message LocationTypeInFileRequest {
  string file_path = 1;
  int32 location_type = 2;
}
message FileContentRequest {
  string file_path = 1;
  bool shows_errors = 2;
}
message FileContentResponse { string content = 1; }
message ErrorFilterRequest { ProtoErrorFilter filter = 1; }
message ErrorFilterFileRequest {
  ProtoErrorFilter filter = 1;
  string file_path = 2;
}
message TooltipTokenIdsRequest {
  repeated uint64 token_ids = 1;
  int32 origin = 2;
}
message TooltipLocationRequest {
  repeated uint64 location_ids = 1;
  repeated uint64 local_symbol_ids = 2;
}

// Engine event stream -------------------------------------------------------
//
// Delivered as server-sent events on GET /api/v1/events: one SSE frame per event, named by the
// oneof arm and carrying that arm's JSON as the data line.

message EngineEvent {
  oneof event {
    IndexingProgressEvent indexing_progress = 1;
    IndexingFinishedEvent indexing_finished = 2;
    IndexingErrorEvent indexing_error = 3;
    StatusInfoEvent status_info = 4;
    IndexingStartedEvent indexing_started = 5;
    UnknownProgressEvent unknown_progress = 6;
    ProgressEvent progress = 7;
    ClearDialogsEvent clear_dialogs = 8;
    ErrorCountEvent error_count = 9;
  }
}

message IndexingStartedEvent {}

// Mirrors DialogView::updateIndexingDialog. These counts never travel on the engine's message bus
// (MessageIndexingStatus carries only a percentage), so the engine's DialogView forwards them here.
message IndexingProgressEvent {
  uint64 started_file_count = 1;
  uint64 finished_file_count = 2;
  uint64 total_file_count = 3;
  repeated string source_paths = 4;
}

message IndexingFinishedEvent {
  uint64 indexed_file_count = 1;
  uint64 total_indexed_file_count = 2;
  uint64 completed_file_count = 3;
  uint64 total_file_count = 4;
  float time_seconds = 5;
  uint64 error_total = 6;
  uint64 error_fatal = 7;
  bool interrupted = 8;
  bool shallow = 9;
}

message IndexingErrorEvent {
  string error_message = 1;
  bool fatal = 2;
}

message StatusInfoEvent {
  string message = 1;
  bool is_error = 2;
}

// DialogView::showUnknownProgressDialog / showProgressDialog / clearDialogs
message UnknownProgressEvent {
  string title = 1;
  string message = 2;
}
message ProgressEvent {
  string title = 1;
  string message = 2;
  uint64 progress = 3;
}
message ClearDialogsEvent {}

message ErrorCountEvent {
  uint64 total = 1;
  uint64 fatal = 2;
}

// ---------- Dialogs ---------------------------------------------------------

// A question the engine needs answered before it can continue. It rides the event stream as a
// `dialog` event; the answer comes back as POST /api/v1/dialogs/{request_id}. The engine blocks the
// asking thread until it arrives, which is why this cannot simply be another one-way event.
message DialogRequest {
  uint64 request_id = 1;
  oneof request {
    ConfirmRequest confirm = 2;
    FinishedIndexingRequest finished_indexing = 3;
  }
}

message ConfirmRequest {
  string message = 1;
  // Button labels, in order; the response carries the selected index.
  repeated string options = 2;
}

// DialogView::finishedIndexingDialog -- the answer decides whether the freshly built temporary
// database replaces the project's database, so the engine cannot proceed without it.
message FinishedIndexingRequest {
  IndexingFinishedEvent summary = 1;
}

message DialogResponse {
  uint64 request_id = 1;
  // Index into ConfirmRequest.options, or the DatabasePolicy for a finished-indexing request.
  int32 selected_option = 2;
}

// ---------- Merged endpoint payloads ----------------------------------------
//
// Each of these answers one endpoint that replaces several former RPCs, because the call sites
// always fired them together. They compose the existing messages rather than restating them.

// GET /api/v1/stats -- was GetStorageStats + GetErrorCount + GetAvailableNodeTypes +
// GetAvailableEdgeTypes, four round trips on every status-bar refresh.
message StatsResponse {
  ProtoStorageStats stats = 1;
  uint64 error_total = 2;
  uint64 error_fatal = 3;
  int32 available_node_types = 4;
  int32 available_edge_types = 5;
}

// GET /api/v1/bookmarks -- was GetAllNodeBookmarks + GetAllEdgeBookmarks + GetAllBookmarkCategories.
message BookmarksResponse {
  repeated ProtoNodeBookmark node_bookmarks = 1;
  repeated ProtoEdgeBookmark edge_bookmarks = 2;
  repeated ProtoBookmarkCategory categories = 3;
}

// POST /api/v1/bookmarks -- node and edge bookmarks share one create route.
message AddBookmarkRequest {
  ProtoBookmark base = 1;
  repeated uint64 node_ids = 2;
  repeated uint64 edge_ids = 3;
  uint64 active_node_id = 4;
}

// GET /api/v1/files/{path} -- was GetFileContent + GetSourceLocationsForFile +
// GetFileInfoForFilePath + GetErrorsForFileLimited, four round trips to open one file. Each part is
// filled only when the `include` query names it.
message FileResponse {
  string content = 1;
  ProtoSourceLocationFile locations = 2;
  ProtoFileInfo info = 3;
  repeated ProtoErrorInfo errors = 4;
}

// POST /api/v1/errors/locations.
//
// The engine synthesizes these locations from the fields below alone -- it does not look the errors
// up again -- and then reads the database only to mark each file complete/indexed. So the request
// carries exactly those four fields instead of whole ErrorInfo rows; the error messages, which are
// the bulk of an error list, no longer cross the boundary just to be sent straight back.
message ErrorLocationsRequest {
  message Entry {
    uint64 id = 1;
    string file_path = 2;
    uint64 line_number = 3;
    uint64 column_number = 4;
  }
  repeated Entry errors = 1;
}

// POST /api/v1/symbols/resolve -- one batch in place of the per-id lookups that made
// BookmarkController cost five round trips per active edge. Every list is optional and the matching
// response list is returned in the same order.
message SymbolResolveRequest {
  // Node ids to describe. Answered with the name hierarchy; the node kind costs a second storage
  // lookup per id, so it is only performed when include_node_kinds asks for it.
  repeated uint64 node_ids = 1;
  bool include_node_kinds = 8;
  // Edges to fetch by id.
  repeated uint64 edge_ids = 2;
  // Serialized NameHierarchy values to look up node ids for.
  repeated string name_hierarchies = 3;
  // File paths to look up node ids for.
  repeated string file_paths = 4;
  // Location ids to map to node ids.
  repeated uint64 location_ids = 5;
  // Token ids to turn into search matches (the search-bar breadcrumb).
  repeated uint64 search_match_token_ids = 6;
  // Node ids to map to their parent file.
  repeated uint64 parent_file_node_ids = 7;
}

message ResolvedNode {
  uint64 id = 1;
  string name_hierarchy_serialized = 2;
  int32 node_kind = 3;
}

message SymbolResolveResponse {
  // One per SymbolResolveRequest.node_ids, in order.
  repeated ResolvedNode nodes = 1;
  // One per SymbolResolveRequest.edge_ids, in order.
  repeated StorageEdge edges = 2;
  // One per SymbolResolveRequest.name_hierarchies, in order.
  repeated uint64 name_hierarchy_node_ids = 3;
  // One per SymbolResolveRequest.file_paths, in order.
  repeated uint64 file_path_node_ids = 4;
  // Node ids for SymbolResolveRequest.location_ids.
  repeated uint64 location_node_ids = 5;
  // Matches for SymbolResolveRequest.search_match_token_ids.
  repeated ProtoSearchMatch search_matches = 6;
  // One per SymbolResolveRequest.parent_file_node_ids, in order.
  repeated NodeIdToParentFileMapResponse.Entry parent_files = 7;
}

// GET /api/v1/project and PUT /api/v1/project both answer with LoadProjectResponse.
